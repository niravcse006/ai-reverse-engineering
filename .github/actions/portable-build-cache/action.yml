name: Portable build cache
description: Restore portable Turbo build outputs from the current run or cross-run cache.
inputs:
  save:
    description: Save newly built outputs after the job succeeds.
    default: "false"
  build_cache_artifact:
    description: Reuse portable Turbo outputs uploaded by the current workflow run.
    default: ""
runs:
  using: composite
  steps:
    - name: Download portable build outputs from this workflow run
      if: inputs.build_cache_artifact != ''
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: ${{ inputs.build_cache_artifact }}
        path: .turbo/cache/
    - name: Resolve portable build task hashes
      id: plan
      if: inputs.build_cache_artifact == ''
      shell: bash
      env:
        BUILD_CACHE_PREFIX: rea-portable-build-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.npmrc', '.nvmrc', 'package-lock.json') }}
      run: |
        npm run --silent test:prepare -- --dry=json |
          node scripts/ci/portable-build-cache.mjs key >> "$GITHUB_OUTPUT"
    - name: Restore portable build outputs
      if: inputs.build_cache_artifact == '' && inputs.save != 'true'
      uses: actions/cache/restore@9255dc7a253b0ccc959486e2bca901246202afeb # v5.0.1
      with:
        path: .turbo/cache/
        key: ${{ steps.plan.outputs.key }}
        restore-keys: ${{ steps.plan.outputs.prefix }}
    - name: Restore and save portable build outputs
      if: inputs.build_cache_artifact == '' && inputs.save == 'true'
      uses: actions/cache@9255dc7a253b0ccc959486e2bca901246202afeb # v5.0.1
      with:
        path: .turbo/cache/
        key: ${{ steps.plan.outputs.key }}
        restore-keys: ${{ steps.plan.outputs.prefix }}
